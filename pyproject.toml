[tool.ruff]
target-version = "py312"
line-length = 100
src = ["dictation_app", "main.py"]
exclude = [
    ".git",
    "venv",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "Gemini Assistant.app",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes (syntax & logic errors, unused imports/variables)
    "I",      # isort (import ordering)
    "B",      # flake8-bugbear (common bug traps and anti-patterns)
    "C4",     # flake8-comprehensions (simplifying list/dict/set operations)
    "UP",     # pyupgrade (modern Python syntax)
    "SIM",    # flake8-simplify (simplifying code structures)
    "RUF",    # Ruff-specific rules
]

ignore = [
    "E501",   # Line length handled by formatter
    "SIM105", # try-except-pass vs contextlib.suppress (contextlib.suppress has overhead in tight loops)
]

[tool.ruff.lint.per-file-ignores]
# Allow Cocoa / PyObjC specific conventions in GUI modules if needed
"dictation_app/menubar.py" = ["PLW0642"]
"dictation_app/hud.py" = ["PLW0642"]

[tool.ruff.lint.isort]
known-first-party = ["dictation_app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
